<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>My Orders — Simba 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --orange:#E8620A;--orange-dark:#c04f06;--orange-light:#fff3eb;
  --black:#0e0c0a;--white:#fffcf8;--gray:#6b6560;--gray-light:#f5f2ee;
  --green:#0a6e3f;--green-light:#e8f5ee;--border:rgba(0,0,0,0.09);
  --red:#dc2626;--red-light:#fef2f2;
  --yellow:#f59e0b;--yellow-light:#fffbeb;
  --blue:#2563eb;--blue-light:#eff6ff;
}
html{scroll-behavior:smooth;}
body{font-family:"DM Sans",sans-serif;background:var(--gray-light);color:var(--black);min-height:100vh;}

/* ── NAV ── */
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(255,252,248,0.97);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(232,98,10,0.12);
  padding:0 4%;display:flex;align-items:center;gap:12px;height:62px;
}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
.nav-logo-img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--orange);flex-shrink:0;}
.nav-logo-text{font-family:"Syne",sans-serif;font-weight:700;font-size:16px;color:var(--black);}
.nav-logo-text span{color:var(--orange);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.nav-links{display:flex;gap:4px;}
.nav-links a{padding:7px 14px;border-radius:10px;font-size:14px;font-weight:500;text-decoration:none;transition:all 0.2s;color:var(--gray);}
.nav-links a:hover{color:var(--orange);}
.nav-links a.active{color:var(--orange);background:var(--orange-light);}
.lang-grp{display:flex;gap:2px;}
.lbtn{background:none;border:1.5px solid transparent;border-radius:14px;padding:4px 9px;font-size:11px;font-weight:600;color:var(--gray);cursor:pointer;transition:all 0.15s;font-family:"DM Sans",sans-serif;}
.lbtn.active{border-color:var(--orange);color:var(--orange);}
.mobile-menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;}

/* ── USER BAR ── */
.user-bar{
  background:white;border-bottom:1px solid var(--border);
  padding:16px 4%;display:flex;align-items:center;gap:16px;
}
.user-avatar{width:48px;height:48px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:white;flex-shrink:0;}
.user-info h2{font-family:"Syne",sans-serif;font-size:18px;font-weight:700;}
.user-info p{font-size:13px;color:var(--gray);margin-top:2px;}
.user-stats{display:flex;gap:24px;margin-left:auto;}
.user-stat{text-align:center;}
.user-stat-val{font-family:"Syne",sans-serif;font-size:20px;font-weight:800;color:var(--orange);}
.user-stat-label{font-size:11px;color:var(--gray);margin-top:2px;}

/* ── TABS ── */
.tab-bar{
  background:white;border-bottom:1px solid var(--border);
  padding:0 4%;display:flex;gap:0;
}
.tab-btn{
  padding:14px 20px;font-family:"DM Sans",sans-serif;font-size:14px;font-weight:500;
  color:var(--gray);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;transition:all 0.2s;
  display:flex;align-items:center;gap:6px;
}
.tab-btn:hover{color:var(--orange);}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange);}
.tab-badge{background:var(--orange);color:white;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;}

/* ── MAIN ── */
.main-wrap{padding:24px 4%;max-width:900px;margin:0 auto;}

/* ── ORDER CARD ── */
.order-card{
  background:white;border-radius:16px;border:1.5px solid var(--border);
  margin-bottom:16px;overflow:hidden;transition:all 0.2s;
}
.order-card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.07);}
.order-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;gap:10px;
}
.order-id{font-family:"Syne",sans-serif;font-weight:700;font-size:15px;}
.order-date{font-size:12px;color:var(--gray);}
.order-actions{margin-left:auto;display:flex;gap:8px;}
.track-btn{
  padding:7px 14px;border-radius:9px;font-size:12px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border);background:white;
  font-family:"DM Sans",sans-serif;transition:all 0.2s;
}
.track-btn:hover{border-color:var(--orange);color:var(--orange);}
.reorder-btn{
  padding:7px 14px;border-radius:9px;font-size:12px;font-weight:600;
  cursor:pointer;border:none;background:var(--orange);color:white;
  font-family:"DM Sans",sans-serif;transition:all 0.2s;
}
.reorder-btn:hover{background:var(--orange-dark);}

.order-card-body{padding:16px 20px;}
.order-meta{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;}
.order-meta-item{display:flex;align-items:center;gap:6px;font-size:13px;}
.order-meta-item .icon{font-size:15px;}
.order-meta-item .val{font-weight:600;}

.status-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;
}
.status-pending{background:var(--yellow-light);color:#92400e;}
.status-confirmed{background:var(--blue-light);color:var(--blue);}
.status-ready{background:var(--green-light);color:var(--green);}
.status-picked{background:var(--gray-light);color:var(--gray);}
.status-cancelled{background:var(--red-light);color:var(--red);}

.items-preview{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;
}
.items-preview::-webkit-scrollbar{display:none;}
.item-thumb{
  width:56px;height:56px;border-radius:10px;background:var(--gray-light);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;overflow:hidden;
}
.item-thumb img{width:100%;height:100%;object-fit:cover;}
.item-qty{position:absolute;bottom:-2px;right:-2px;background:var(--orange);color:white;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

.order-card-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-top:1px solid var(--border);
  background:var(--gray-light);
}
.order-total{font-family:"Syne",sans-serif;font-weight:700;font-size:16px;}
.order-balance{font-size:12px;color:var(--gray);margin-top:2px;}

/* ── STATUS TIMELINE ── */
.timeline{padding:16px 20px;border-top:1px solid var(--border);}
.timeline-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray);margin-bottom:14px;}
.timeline-steps{display:flex;gap:0;position:relative;}
.timeline-steps::before{content:'';position:absolute;top:12px;left:12px;right:12px;height:2px;background:var(--border);}
.timeline-step{
  flex:1;text-align:center;position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.timeline-dot{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  background:white;display:flex;align-items:center;justify-content:center;font-size:11px;
  transition:all 0.2s;
}
.timeline-step.done .timeline-dot{background:var(--green);border-color:var(--green);color:white;}
.timeline-step.current .timeline-dot{background:var(--orange);border-color:var(--orange);color:white;}
.timeline-label{font-size:10px;font-weight:600;color:var(--gray);line-height:1.3;}
.timeline-step.done .timeline-label,.timeline-step.current .timeline-label{color:var(--black);}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:white;border-radius:20px;max-width:480px;width:100%;
  max-height:90vh;overflow-y:auto;padding:28px;
}
.modal-title{font-family:"Syne",sans-serif;font-size:20px;font-weight:800;margin-bottom:20px;}
.modal-row{display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;}
.modal-row .label{color:var(--gray);}
.modal-row .val{font-weight:600;}
.modal-close{
  width:100%;margin-top:18px;padding:12px;background:var(--gray-light);
  border:none;border-radius:12px;font-family:"DM Sans",sans-serif;
  font-weight:600;cursor:pointer;transition:all 0.2s;
}
.modal-close:hover{background:var(--black);color:white;}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:60px 20px;
  background:white;border-radius:16px;border:1.5px solid var(--border);
}
.empty-icon{font-size:52px;margin-bottom:16px;}
.empty-state h3{font-family:"Syne",sans-serif;font-size:20px;font-weight:700;margin-bottom:8px;}
.empty-state p{font-size:14px;color:var(--gray);margin-bottom:20px;}
.empty-btn{
  background:var(--orange);color:white;border:none;padding:12px 24px;
  border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:"DM Sans",sans-serif;
}
.shop-link{
  display:inline-block;margin-top:12px;color:var(--orange);
  font-weight:600;text-decoration:none;font-size:14px;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--black);color:white;
  padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;
  z-index:500;transform:translateY(80px);opacity:0;transition:all 0.3s;
  display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.green{background:var(--green);}

/* ── GUEST BANNER ── */
.guest-banner{
  background:linear-gradient(135deg,var(--orange-light),white);
  border:1.5px solid rgba(232,98,10,0.2);border-radius:16px;
  padding:24px;text-align:center;margin-bottom:24px;
}
.guest-banner h3{font-family:"Syne",sans-serif;font-size:18px;font-weight:700;margin-bottom:6px;}
.guest-banner p{font-size:14px;color:var(--gray);margin-bottom:14px;}
.guest-banner a{
  display:inline-block;background:var(--orange);color:white;
  padding:10px 22px;border-radius:10px;text-decoration:none;
  font-weight:600;font-size:14px;
}

@media(max-width:600px){
  .user-stats{display:none;}
  .nav-links{display:none;}
  .mobile-menu-btn{display:block;}
  .order-card-header{flex-direction:column;align-items:flex-start;}
  .order-actions{width:100%;}
  .track-btn,.reorder-btn{flex:1;}
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="index.html">
    <svg class="nav-logo-img" width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-label="Simba"><circle cx="18" cy="18" r="18" fill="#E8620A"/><text x="18" y="18" text-anchor="middle" dominant-baseline="central" fill="white" font-size="20" font-weight="bold" font-family="Syne,Arial,sans-serif">S</text></svg>
    <span class="nav-logo-text">Simba <span>2.0</span></span>
  </a>
  <div class="nav-right">
    <div class="lang-grp">
      <button class="lbtn" onclick="setLang('en')" id="btn-en">EN</button>
      <button class="lbtn" onclick="setLang('fr')" id="btn-fr">FR</button>
      <button class="lbtn" onclick="setLang('rw')" id="btn-rw">RW</button>
    </div>
    <div class="nav-links">
      <a href="index.html" data-t="nav_home">Home</a>
      <a href="shop.html" data-t="nav_shop">Shop</a>
      <a href="orders.html" class="active" data-t="nav_orders">My Orders</a>
      <a href="auth.html?redirect=orders.html" data-t="nav_profile">Account</a>
    </div>
    <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
  </div>
</nav>

<!-- USER BAR -->
<div class="user-bar">
  <div class="user-avatar" id="userAvatar">?</div>
  <div class="user-info">
    <h2 id="userName" data-t="my_orders">My Orders</h2>
    <p id="userEmail" data-t="order_history">Order history & tracking</p>
  </div>
  <div class="user-stats" id="userStats">
    <div class="user-stat"><div class="user-stat-val" id="statTotal">0</div><div class="user-stat-label" data-t="total_orders">Total Orders</div></div>
    <div class="user-stat"><div class="user-stat-val" id="statSpent">0</div><div class="user-stat-label" data-t="total_spent">Total Spent</div></div>
  </div>
</div>

<!-- TABS -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="filterTab('all',this)" data-t="tab_all">All <span class="tab-badge" id="badge-all">0</span></button>
  <button class="tab-btn" onclick="filterTab('pending',this)" data-t="tab_pending">Pending <span class="tab-badge" id="badge-pending">0</span></button>
  <button class="tab-btn" onclick="filterTab('confirmed',this)" data-t="tab_confirmed">Confirmed <span class="tab-badge" id="badge-confirmed">0</span></button>
  <button class="tab-btn" onclick="filterTab('ready',this)" data-t="tab_ready">Ready <span class="tab-badge" id="badge-ready">0</span></button>
  <button class="tab-btn" onclick="filterTab('picked',this)" data-t="tab_picked">Picked Up <span class="tab-badge" id="badge-picked">0</span></button>
</div>

<!-- MAIN -->
<div class="main-wrap" id="mainWrap"></div>

<!-- ORDER DETAIL MODAL -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <div class="modal-title" data-t="order_detail">Order Details</div>
    <div id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()" data-t="close">Close</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="js/services.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/lang-switcher.js"></script>
<script>
let lang = localStorage.getItem("simba_lang")||"en";
let orders = [];
let activeFilter = "all";

function tr(k){return (T[lang]||T.en)[k]||k;}
function fmt(n){return Math.round(n).toLocaleString()+" "+tr("rwF");}
function timeAgo(d){
  const mins=Math.floor((Date.now()-new Date(d))/60000);
  if(mins<1) return "just now";
  if(mins<60) return mins+"m ago";
  const hrs=Math.floor(mins/60);
  if(hrs<24) return hrs+"h ago";
  return Math.floor(hrs/24)+"d ago";
}
function dateStr(d){
  return new Date(d).toLocaleDateString(lang==="rw"?"rw-RW":lang==="fr"?"fr-FR":"en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

function setLang(l){
  lang=l;localStorage.setItem("simba_lang",l);
  applyLang();renderAll();
}
function setActiveLangBtn(){
  ["en","fr","rw"].forEach(l=>{
    document.getElementById("btn-"+l).classList.toggle("active",l===lang);
  });
}
function applyLang(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k=el.getAttribute("data-t");el.textContent=tr(k);
  });
}

async function loadOrders(){
  const token = localStorage.getItem('simba_token');
  if (!token) {
    orders = [];
    renderOrders();
    return;
  }
  
  try {
    const res = await orders.list();
    if (res && Array.isArray(res)) {
      orders = res.map(o => ({
        id: o.id,
        total: o.total_price,
        status: o.status,
        paid: o.paid,
        created: o.created_at,
        items: o.items,
      }));
    }
  } catch (e) {
    // Fallback to localStorage
    const stored = JSON.parse(localStorage.getItem("simba_orders")||"[]");
    if (stored.length > 0) orders = stored;
  }
  renderOrders();
}
function generateDemoOrders(){
  const statuses = ["pending","confirmed","confirmed","ready","ready","picked","picked","picked"];
  const data = [];
  for(let i=0;i<12;i++){
    const status = statuses[i%statuses.length];
    const hoursAgo = Math.floor(Math.random()*72);
    const total = Math.round((Math.random()*45000+3000)/100)*100;
    data.push({
      id:"SB-"+Math.random().toString(36).slice(2,8).toUpperCase(),
      branch:BRANCHES[i%BRANCHES.length],
      slot:["08:00–09:00","10:00–11:00","12:00–13:00","14:00–15:00","16:00–17:00"][i%5],
      total,deposit:Math.round(total*0.5),
      status,time:new Date(Date.now()-hoursAgo*3600000),
      items:[
        {name:"Dove Body Wash 500ml",price:8983,qty:1},
        {name:"Inyange Milk 1L",price:1600,qty:2},
        {name:"Sunflower Oil 1L",price:4300,qty:1},
      ].slice(0,Math.ceil(Math.random()*3)+1),
      notes:i%4===0?"Please ring the bell when you arrive":""}
    );
  }
  return data.sort((a,b)=>new Date(b.time)-new Date(a.time));
}

function updateUserInfo(){
  const user = JSON.parse(localStorage.getItem("simba_user")||"null");
  const token = localStorage.getItem("simba_token");
  
  if(user){
    document.getElementById("userAvatar").textContent = (user.name||user.username||user.email||"?").charAt(0).toUpperCase();
    document.getElementById("userName").textContent = user.name||user.username||tr("my_orders");
    document.getElementById("userEmail").textContent = user.email||"";
  } else {
    document.getElementById("userAvatar").textContent = "U";
    document.getElementById("userName").textContent = tr("guest_title");
    document.getElementById("userEmail").textContent = tr("guest_sub");
  }
  
  const total = orders.length;
  const spent = orders.filter(o=>o.status==="picked").reduce((s,o)=>s+o.total,0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSpent").textContent = fmt(spent).replace(" RWF","");
}

function updateBadges(){
  const counts = {all:orders.length,pending:0,confirmed:0,ready:0,picked:0};
  orders.forEach(o=>{if(counts[o.status]!==undefined) counts[o.status]++;});
  Object.keys(counts).forEach(k=>{
    const el=document.getElementById("badge-"+k);
    if(el) el.textContent=counts[k];
  });
}

function getStatusClass(s){
  const map={pending:"status-pending",confirmed:"status-confirmed",ready:"status-ready",picked:"status-picked",cancelled:"status-cancelled"};
  return map[s]||"status-pending";
}

function getTimelineSteps(status){
  const steps=["placed","paid","confirmed","ready","picked"];
  const labels={placed:tr("placed"),paid:tr("paid"),confirmed:tr("confirmed"),ready:tr("ready_label"),picked:tr("picked_up")};
  const stepOrder={pending:0,confirmed:1,ready:3,picked:4};
  const current = stepOrder[status]||0;
  return steps.map((s,i)=>{
    let cls="timeline-step";
    if(i<current) cls+=" done";
    else if(i===current) cls+=" current";
    return `<div class="${cls}"><div class="timeline-dot">${i<=current?"✓":i+1}</div><div class="timeline-label">${labels[s]}</div></div>`;
  }).join("");
}

function renderOrders(){
  const wrap=document.getElementById("mainWrap");
  const token=localStorage.getItem("simba_token");
  const user=JSON.parse(localStorage.getItem("simba_user")||"null");
  
  let filtered=orders;
  if(activeFilter!=="all") filtered=orders.filter(o=>o.status===activeFilter);
  
  if(!token && !user){
    wrap.innerHTML=`
      <div class="guest-banner">
        <h3>${tr("guest_title")}</h3>
        <p>${tr("guest_sub")}</p>
        <a href="auth.html?redirect=orders.html">${tr("sign_in")}</a>
      </div>
      <div class="empty-state">
        <div class="empty-icon">&#9633;</div>
        <h3>${tr("no_orders")}</h3>
        <p>${tr("no_orders_sub")}</p>
        <a href="shop.html" class="shop-link">${tr("start_shopping")}</a>
      </div>`;
    return;
  }
  
  if(!filtered.length){
    wrap.innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">&#9633;</div>
        <h3>${tr("no_orders")}</h3>
        <p>${tr("no_orders_sub")}</p>
        <a href="shop.html" class="shop-link">${tr("start_shopping")}</a>
      </div>`;
    return;
  }
  
  wrap.innerHTML=filtered.map(o=>`
    <div class="order-card">
      <div class="order-card-header">
        <div>
          <div class="order-id">${o.id}</div>
          <div class="order-date">${dateStr(o.time)} · ${timeAgo(o.time)}</div>
        </div>
        <div class="order-actions">
          <button class="track-btn" onclick="viewOrder('${o.id}')">${tr("btn_track")}</button>
          <button class="reorder-btn" onclick="reorder('${o.id}')">${tr("btn_reorder")}</button>
        </div>
      </div>
      <div class="order-card-body">
        <div class="order-meta">
          <div class="order-meta-item"><span class="icon">&#9679;</span><span class="val">${o.branch.name||o.branch}</span></div>
          <div class="order-meta-item"><span class="icon">⏰</span><span class="val">${o.slot}</span></div>
          <div class="order-meta-item"><span class="icon">#</span><span class="val">${o.items.length} ${tr("items").toLowerCase()}</span></div>
        </div>
        <div style="margin-bottom:10px;">
          <span class="status-badge ${getStatusClass(o.status)}">● ${tr("status_"+o.status)}</span>
        </div>
        <div class="items-preview">
          ${o.items.map(item=>`
            <div class="item-thumb" title="${item.name}">
              <span style="font-size:24px;">${SAMPLE_IMAGES[item.name.charCodeAt(0)%SAMPLE_IMAGES.length]}</span>
              <div class="item-qty">${item.qty||1}</div>
            </div>`).join("")}
        </div>
      </div>
      <div class="timeline">${getTimelineSteps(o.status)}</div>
      <div class="order-card-footer">
        <div>
          <div class="order-total">${fmt(o.total)}</div>
          <div class="order-balance">${tr("deposit")}: ${fmt(o.deposit)}</div>
        </div>
      </div>
    </div>`).join("");
}

function viewOrder(id){
  const o=orders.find(x=>x.id===id);
  if(!o) return;
  document.getElementById("modalBody").innerHTML=`
    <div class="modal-row"><span class="label">${tr("order_detail")}</span><span class="val">${o.id}</span></div>
    <div class="modal-row"><span class="label">${tr("branch")}</span><span class="val">${o.branch.name||o.branch}</span></div>
    <div class="modal-row"><span class="label">${tr("pickup_time")}</span><span class="val">${o.slot}</span></div>
    <div class="modal-row"><span class="label">${tr("total_orders")}</span><span class="val" style="color:var(--orange)">${fmt(o.total)}</span></div>
    <div class="modal-row"><span class="label">${tr("deposit")}</span><span class="val">${fmt(o.deposit)}</span></div>
    <div class="modal-row"><span class="label">${tr("balance")}</span><span class="val">${fmt(o.total-o.deposit)}</span></div>
    <div class="modal-row"><span class="label">Status</span><span class="val"><span class="status-badge ${getStatusClass(o.status)}">${tr("status_"+o.status)}</span></span></div>
    ${o.notes?`<div class="modal-row"><span class="label">${tr("notes")}</span><span class="val">${o.notes}</span></div>`:""}
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);margin:16px 0 8px;">${tr("items")}</div>
    ${o.items.map(item=>`
      <div class="modal-row"><span class="label">${item.name}</span><span class="val">${item.qty||1} × ${fmt(item.price)}</span></div>
    `).join("")}`;
  document.getElementById("orderModal").classList.add("open");
}
function closeModal(){document.getElementById("orderModal").classList.remove("open");}

function reorder(id){
  const o = orders.find(x => x.id === id);
  if (!o) return;
  o.items?.forEach(item => {
    Cart.add({
      id: item.id || Math.random(),
      name: item.name,
      price: item.price,
      category: item.category,
      image: item.image,
    }, item.qty || 1);
  });
  showToast(tr("reorder_msg"), "green");
}

function filterTab(f,btn){
  activeFilter=f;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderOrders();
}

function showToast(msg,type=""){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.className="toast show"+(type?" "+type:"");
  setTimeout(()=>t.classList.remove("show"),3000);
}

function renderAll(){
  updateUserInfo();
  updateBadges();
  renderOrders();
}

document.getElementById("orderModal").addEventListener("click",function(e){if(e.target===this)closeModal();});

loadOrders();
setActiveLangBtn();
renderAll();
lucide.createIcons();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Simba API Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .success { color: green; }
    .error { color: red; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    button { padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Simba 2.0 API Test</h1>
  <button onclick="testAPI()">Test API Connection</button>
  <div id="result"></div>
  
  <script>
    const API_BASE = 'http://127.0.0.1:8000/api/v1';
    
    async function testAPI() {
      const result = document.getElementById('result');
      result.innerHTML = 'Testing...';
      
      try {
        // Test products
        const r1 = await fetch(API_BASE + '/products/');
        const products = await r1.json();
        
        // Test categories  
        const r2 = await fetch(API_BASE + '/products/categories/');
        const categories = await r2.json();
        
        result.innerHTML = `
          <p class="success">✓ API Connected!</p>
          <p>Products: ${products.length}</p>
          <p>Categories: ${categories.length}</p>
          <pre>${JSON.stringify(products.slice(0, 3), null, 2)}</pre>
        `;
      } catch (e) {
        result.innerHTML = `<p class="error">✗ Error: ${e.message}</p>`;
      }
    }
    
    // Auto-test on load
    testAPI();
  </script>
</body>
</html>
